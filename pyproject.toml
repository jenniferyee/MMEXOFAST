[project]
name = "mmexofast"
version = "0.1.0"
description = "Automated fitting of microlensing light curves"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Jennifer Yee" }]
keywords = ["astronomy", "microlensing", "exoplanets", "light curves"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
  "numpy",
  "scipy",
  "matplotlib",
  "pandas",
  "astropy",
  "emcee",
  "pyyaml",
  "MulensModel>=3",
  "sfit_minimizer>=1.0.3",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/jenniferyee/MMEXOFAST"
Repository = "https://github.com/jenniferyee/MMEXOFAST"
Issues = "https://github.com/jenniferyee/MMEXOFAST/issues"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "source" }

[tool.setuptools.packages.find]
where = ["source"]
include = ["mmexofast*"]

# The Spitzer ephemerides needed at runtime, plus the sample events and unit
# test fixtures, so the tests run from an installed package (868 KB). The
# 2018 Data Challenge is excluded -- see config.SAMPLE_DATA_PATH.
[tool.setuptools.package-data]
mmexofast = ["data/*.txt", "data/*/*.txt", "data/*/*.dat"]
