name: Lint

# The pre-commit hook only protects people who ran `pre-commit install`, so the
# same checks run here too. Contributions from forks get checked either way.
#
# Kept separate from tests.yml so a formatting failure is distinguishable from
# a test failure at a glance, and so this reports in seconds rather than
# waiting on the 12-minute slow job.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      # Version pinned to match .pre-commit-config.yaml exactly. If these two
      # drift, CI and the hook disagree about formatting and every PR fights
      # the difference.
      - name: ruff check source
        run: uvx ruff@0.16.0 check --output-format github ./source

      - name: ruff format source  
        run: uvx ruff@0.16.0 format --check --diff ./source
      
      - name: ruff check examples
        run: uvx ruff@0.16.0 check --output-format github ./examples

      - name: ruff format examples  
        run: uvx ruff@0.16.0 format --check --diff ./examples
