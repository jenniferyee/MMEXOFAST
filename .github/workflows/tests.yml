name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - session: test
            python-version: "3.12"
            uv-extra-args: "--extra test"
            pytest-args: "--fast"
            timeout: 15
          - session: test
            python-version: "3.14"
            uv-extra-args: "--extra test"
            pytest-args: "--fast"
            timeout: 15
          # The grid searches skipped by --fast dominate the runtime (~13 min
          # locally vs ~6 s for the rest), so they run once rather than on
          # every interpreter in the matrix.
          - session: test_slow
            python-version: "3.12"
            uv-extra-args: "--extra test"
            pytest-args: ""
            timeout: 60

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: >
          uv run ${{ matrix.uv-extra-args }}
          pytest -v ${{ matrix.pytest-args }} source/mmexofast/unit_tests
