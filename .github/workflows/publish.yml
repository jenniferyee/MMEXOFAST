name: Publish

# MMEXOFAST is pure Python, so there are no per-platform binary wheels to
# build -- one sdist plus one py3-none-any wheel covers everything.
#
# Triggers:
#   push of a v* tag  -> build, verify, run the suite, publish to PyPI
#   workflow_dispatch -> build and verify only; optionally publish to TestPyPI
#
# Publishing uses PyPI Trusted Publishing (OIDC), so there is no API token in
# the repository secrets. The trust is registered on PyPI against this exact
# combination and nothing else can use it:
#
#     owner/repo:  jenniferyee/MMEXOFAST
#     workflow:    publish.yml   <- this file's name; renaming it breaks
#                                   publishing until PyPI is updated too
#     environment: pypi          <- must also exist in repo Settings
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      testpypi:
        description: "Also publish the build to TestPyPI (rehearsal)"
        required: false
        type: boolean
        default: false

jobs:
  # The full suite, gating the real PyPI upload below. Reused from tests.yml
  # via workflow_call rather than copied, so a release runs the same suite CI
  # runs and the two cannot drift.
  tests:
    uses: ./.github/workflows/tests.yml
    # A called workflow cannot request more permission than its caller grants.
    # tests.yml's latest-deps job asks for `issues: write`, and without this
    # the whole workflow fails at startup -- before any job runs, and whether
    # or not that job would have been skipped by its own `if:`.
    permissions:
      contents: read
      issues: write

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build --sdist --wheel --out-dir dist

      - name: Check metadata renders on PyPI
        run: uvx twine check --strict dist/*

      # The version is derived from the tag by setuptools-scm, so the original
      # reason for this check -- tagging without remembering to bump a static
      # version in pyproject.toml -- can no longer happen. It is kept because
      # it still catches two tags landing on one commit, where `git describe`
      # picks between them non-deterministically and can name the artifacts
      # after the wrong one. A PyPI version can never be reused, so check
      # before uploading rather than after.
      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          built=$(ls dist/*.tar.gz | sed -E 's|.*/mmexofast-(.*)\.tar\.gz|\1|')
          echo "tag=$tag built=$built"
          if [ "$tag" != "$built" ]; then
            echo "::error::Tag $GITHUB_REF_NAME implies version '$tag' but the" \
                 "build produced '$built'. Refusing to publish. Bump" \
                 "[project] version in pyproject.toml to match the tag."
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*

  # Rehearsal target. TestPyPI needs its own trusted publisher registered
  # against this same workflow, with environment name "testpypi".
  #
  # Gated on build only, NOT on tests: this exists to exercise the publish
  # plumbing quickly, and TestPyPI is disposable. The real upload below is the
  # one that must wait for a green suite.
  testpypi:
    name: Publish to TestPyPI
    needs: [build]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.testpypi
    environment:
      name: testpypi
      url: https://test.pypi.org/p/mmexofast
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  # needs: tests as well as build -- a PyPI version can never be reused, so a
  # release must not be able to go out over a red suite.
  pypi:
    name: Publish to PyPI
    needs: [build, tests]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    environment:
      name: pypi
      url: https://pypi.org/p/mmexofast
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  # Pushing a tag publishes to PyPI but does NOT create a GitHub Release -- that
  # is a separate object -- so the Releases page silently falls behind the tags.
  # Create it here from the annotated tag's own message so the two never
  # diverge. Tags containing a/b/rc are marked as pre-releases. Same job as
  # exoplanet-core, sfit_minimizer, and EXOZIPPy.
  github_release:
    needs: [pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          # Body = the annotated tag message minus its first line (the title).
          git tag -l "$tag" --format='%(contents)' | tail -n +2 > notes.md
          prerelease=""
          case "$tag" in
            *a*|*b*|*rc*) prerelease="--prerelease" ;;
          esac
          gh release create "$tag" --verify-tag --title "$tag" \
            --notes-file notes.md $prerelease dist/*
